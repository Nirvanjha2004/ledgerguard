version: "3.9"
services:
  ledgerguard:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./data:/app/data
    env_file: .env
    command: npm run dev

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerguard
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
